# HUB Central — configuração nginx.
#
# Serve a SPA (frontend) e faz reverse proxy das chamadas /api para o backend
# (API + worker) rodando localmente na porta 3000.
#
# Instalado pelo scripts/install.sh em /etc/nginx/sites-available/hubcentral
# (ou conf.d) e ativado. Ajuste server_name para o seu domínio.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Raiz dos artefatos estáticos do frontend (vite build).
    root /opt/hubcentral/frontend/dist;
    index index.html;

    # Limite de upload (importações CSV/JSON/XLSX).
    client_max_body_size 25m;

    # Reverse proxy da API para o backend local.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Arquivos públicos servidos pelo backend (ex.: logotipo do branding).
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: qualquer rota da aplicação retorna o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets com hash no nome.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --- HTTPS (recomendado em produção) ---
# Depois de configurar o server_name acima com seu domínio, habilite TLS com:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d seu-dominio.com
# O certbot ajusta este arquivo para escutar em 443 e redirecionar 80 -> 443.
