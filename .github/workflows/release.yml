name: Release

# Em cada tag v*, compila o frontend e anexa o artefato pronto à release,
# para que servidores pequenos (ex.: VMs de 1GB) não precisem compilar.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Empacotar dist
        run: tar -czf frontend-dist.tar.gz -C frontend dist

      - name: Criar release (se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Garante que a release da tag exista. Se já existir, não faz nada;
          # caso contrário, cria com notas automáticas a partir dos commits.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Anexar artefato à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anexa o artefato compilado; --clobber substitui se já houver.
          gh release upload "${GITHUB_REF_NAME}" frontend-dist.tar.gz --clobber
